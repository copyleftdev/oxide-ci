# Pre-commit hooks for Oxide CI
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

# Generated and fixture files whose bytes are the point. The whitespace hooks
# would corrupt them: appending a newline to a fuzz corpus entry changes the
# input being tested, and the Hypothesis and Playwright files are rewritten by
# their own tooling anyway.
exclude: |
  (?x)^(
    examples/rust-fuzzing/fuzz/corpus/.*|
    examples/python-hypothesis/\.hypothesis/.*|
    examples/typescript-playwright/test-results/.*
  )$

repos:
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        entry: cargo fmt --all -- --check
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        entry: cargo clippy --workspace --all-targets -- -D warnings
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-check
        name: cargo check
        entry: cargo check --workspace
        language: system
        types: [rust]
        pass_filenames: false

      - id: cargo-test
        name: cargo test
        entry: cargo test --workspace --lib --bins
        language: system
        types: [rust]
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
